name = "miko-art"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]
main = ".svelte-kit/worker.js"

[assets]
directory = ".svelte-kit/cloudflare"
binding = "ASSETS"

# Pages will be deployed via `wrangler pages deploy`
# For local development, use `wrangler pages dev`

[[d1_databases]]
binding = "DB"
database_name = "miko-art-db"
database_id = "your-database-id-here"  # Replace after running: wrangler d1 create miko-art-db

[vars]
# Non-sensitive environment variables
# BOOKING_CAPACITY = "8"
# BOOKING_SLOT_MINUTES = "30"

[alias]
"@node-rs/argon2" = "./src/lib/stubs/argon2.ts"
"@node-rs/bcrypt" = "./src/lib/stubs/bcrypt.ts"
"@node-rs/argon2-wasm32-wasi" = "./src/lib/stubs/argon2.ts"
"@node-rs/bcrypt-wasm32-wasi" = "./src/lib/stubs/bcrypt.ts"

# Secrets are encrypted in config/env/.env.production (via dotenvx).
# Push to Cloudflare with: pnpm deploy:secrets
