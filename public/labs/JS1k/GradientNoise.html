<title>JS1k: Gradient Noise (928 bytes)</title>
<script type="text/javascript">

/*

	Gradient Noise
	--------------------------


*/

window.onload = function () {
	d = document.getElementById("c");
	d.width = window.innerWidth;
	d.height = window.innerHeight;
	deg = 0;
	time = window.setInterval(function() {
		var c = d.getContext("2d"),
			g = c.createLinearGradient(10, 90, 350, 90);
		var r = [];
		var i = 2; while(i--) {
			var rgb = [Math.random()*255>>0, Math.random()*255>>0, Math.random()*255>>0];
			g.addColorStop(i / 1, "rgba(" + rgb.join(",") + ",0.5)" );
			r.push(rgb);
		}
		c.fillStyle = g;
		c.fillRect(10, 10, 550, 150);
		var g = c.createLinearGradient(0, 0, d.width, d.width);
		for (var i = 0; i <= d.width; i++) {
			var n = i / d.width;
			var a = r[0];
			var b = r[1];
			var a = [ // blend two colors
				a[0]*(1-n)+b[0]*n, // R
				a[1]*(1-n)+b[1]*n, // G
				a[2]*(1-n)+b[2]*n, // B
				a[3]*(1-n)+b[3]*n  // A
			];
			var hex = 0xFFFFFF * Math.random();
			var b = [
				(hex >> 16), 
				(hex >> 8) & 0xFF, 
				hex & 0xFF
			];
			HardLight = function(A, B) { //+
				if(B < 128) return (B * A) >> 7;
				else return 255 - ((255 - B) * (255 - A) >> 7);
			};
			var blend = [
				HardLight(a[0], a[0]), 
				HardLight(a[1], b[1]),
				HardLight(b[2], b[2])
			];
			g.addColorStop(i / d.width, "rgba("+blend.join(",")+",1)");
		}
		c.fillStyle = g;
		c.fillRect(0, 0, window.innerWidth, window.innerHeight);
		c.font = "bold 210pt arial";
		c.fillStyle = "rgba(0,0,0,0.5)";
		c.fillText("JS1k", 50, 270);
	},0);
}

</script>
