<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" lang="en">
<head>
	<title>JS1k: Micro Sketchpad (1024 bytes)</title>
	<script type="text/javascript">

		/*
			Micro Sketchpad (1024 bytes)
			----------------------------
			window.onload=function(){Q=Math.random;C=Math.cos;S=Math.sin;H=0;w=window;d=document.getElementById("c");c=d.getContext("2d");c.fillRect(0,0,d.width=w.innerWidth*2,d.height=w.innerHeight*2);c.globalCompositeOperation="lighter";c.lineWidth=0.5;setTimeout(function(){c.font="210px Arial";n=360;while(n--){c.globalAlpha=n/1500;c.strokeStyle="hsl("+(n+110%360)+",99%,50%)";x=-n*C(n/360);y=250-S(n/360*2)*n/2.5;c.strokeText("JS1k",x+230,y+70);c.strokeText("Draw!",x+380,y+255)}c.globalAlpha=0.4},0);d.onmousedown=function(b){function a(l,j){X=l.pageX;Y=l.pageY;if(j=="down"){var s,p,h=X,g=Y,k=Q()*99,f=Q()*99,o=Q()*99,u=0;time=setInterval(function(){i=10;while(i--){c.beginPath();q=(k/f-1)*u;x=(k-f)*C(u)+o*C(q)+(h+(X-h)*(i/10))+(f-k);y=(k-f)*S(u)-o*S(q)+(g+(Y-g)*(i/10));if(s){c.moveTo(s,p);c.lineTo(x,y)}c.strokeStyle="hsl("+(H%360)+",99%,50%)";c.stroke();u+=360*Math.PI/180*2;s=x;p=y}H++;h=X;g=Y},5)}else{if(j=="up"){clearTimeout(time)}}}a(b,"down");d.onmousemove=function(f){a(f,"move")};d.onmouseup=function(f){a(f,"up")}}};

		*/

		window.onload = function () {
			Q = Math.random; // cache Math objects
			C = Math.cos;
			S = Math.sin;
			H = 0;
			w = window;
			d = document.getElementById("c");
			c = d.getContext("2d");
			c.fillRect(0, 0, d.width = w.innerWidth * 2, d.height = w.innerHeight * 2); // resize <canvas> and draw black rect (default)
			c.globalCompositeOperation = "lighter"; // switch to additive color application
			c.lineWidth = 0.5;
			setTimeout(function () { // timeout fix for chrome bug (http://code.google.com/p/chromium/issues/detail?id=44017)
				c.font = "210px Arial";
				n = 360;
				while (n--) { // loop through spectrum
					c.globalAlpha = n / 1500; // gradually fade out
					c.strokeStyle = "hsl(" + (n + 110 % 360) + ",99%,50%)"; // iterate hue
					x = -n * C(n / 360); // cosine
					y = 250 - S(n / 360 * 2) * n / 2.5; // sin
					c.strokeText("JS1k", x + 230, y + 70); // draw rainbow text
					c.strokeText("Draw!", x + 380, y + 255)
				}
				c.globalAlpha = 0.4
			}, 0)
			d.onmousedown = function (e) {
				function f(e, m) {
					X = e.pageX; // grab mouse pixel coords
					Y = e.pageY;
					if (m == 'down') {
						var a, // previous coord.x
							b, // previous coord.y
							A = X, // original coord.x
							B = Y, // original coord.y
							R = Q() * 99, // rolling circle radius
							r = Q() * 99, // fixed circle radius
							d = Q() * 99, // distance
							t = 0; // theta
						time = setInterval(function () { // start looping spectrum
							i = 10;
							while (i--) {
								c.beginPath();
								q = (R / r - 1) * t; // create hypotrochoid from current mouse position, and setup variables (see: http://en.wikipedia.org/wiki/Hypotrochoid)
								x = (R - r) * C(t) + d * C(q) + (A + (X - A) * (i / 10)) + (r - R); // center on xy coords
								y = (R - r) * S(t) - d * S(q) + (B + (Y - B) * (i / 10));
								if (a) { // draw once two points are set
									c.moveTo(a, b);
									c.lineTo(x, y)
								}
								c.strokeStyle = "hsl(" + (H % 360) + ",99%,50%)"; // draw rainbow hypotrochoid
								c.stroke();
								t += 360 * Math.PI / 180 * 2; // increment theta
								a = x; // set previous coord.x
								b = y; // set previous coord.y
							}
							H++; // increment hue
							A = X; // set original coord.x
							B = Y; // set original coord.y
						}, 5)
					} else if (m == 'up') { // clear hypotrochoid animation
						clearTimeout(time)
					}
				}

				f(e, 'down'); // draw
				d.onmousemove = function (e) { f(e, 'move') } // draw
				d.onmouseup = function (e) { f(e, 'up') } // clear
			}
		}

	</script>
