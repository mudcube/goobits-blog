<script type="text/javascript">

/*

	window.onload=function(){w=window;d=document;c=d.getElementById("c");t=c.getContext("2d");W=w.innerWidth;H=w.innerHeight;c.style.width=W+"px";c.style.height=H+"px";d.onmousemove=function(g){t.drawImage(img,0,0);var a=(g.pageX/W)*255-127,k=(g.pageY/H)*255-127,h=t.getImageData(0,0,c.width,c.height),f=h.data;for(var b=0,j=f.length;b<j;b+=4){f[b]=f[b]+a-k;f[b+1]=f[b+1]-a-k;f[b+2]=f[b+2]+k+k}t.putImageData(h,0,0)};t.drawImage(img=(function(){var e=d.createElement("canvas"),f=e.getContext("2d"),b=150,j=-50,i=-75;c.width=e.width=b*W/H;c.height=e.height=b;f.fillRect(0,0,W,H);n=360;while(n--){var a=j+b,k=i+b;var h=f.createLinearGradient(a,i,a,k);h.addColorStop(0,"#000");h.addColorStop(0.5,"hsl("+((n+60)%360)+",100%,50%)");h.addColorStop(1,"#FFF");f.beginPath();f.moveTo(a,i);f.lineTo(a,k);f.lineTo(a+2,k);f.lineTo(a+5,i);f.fillStyle=h;f.fill();f.translate(a,k);f.rotate((1/360)*Math.PI*2);f.translate(-a,-k)}return e})(),0,0)};

*/

window.onload = function () {
	w = window;
	d = document;
	c = d.getElementById("c");
	t = c.getContext("2d");
	W = w.innerWidth;
	H = w.innerHeight;
	c.style.width = W + "px";
	c.style.height = H + "px";
	d.onmousemove = function(e) {
		t.drawImage(img, 0, 0);
		var x = (e.pageX / W) * 255 - 127, // grab mouse pixel coords, center at midpoint
			y = (e.pageY / H) * 255 - 127,
			o = t.getImageData(0, 0, c.width, c.height), // get image data
			q = o.data;
		for(var i = 0, n = q.length; i < n; i += 4) {
			q[i] = q[i] + x - y; // red (control left)
			q[i + 1] = q[i + 1] - x - y; // green (control right)
			q[i + 2] = q[i + 2] + y + y; // blue (control down)
		}
		t.putImageData(o, 0, 0);
	}
	t.drawImage(img = (function() { // create Sphere image, and apply to <canvas>
		var v = d.createElement("canvas"),
			t = v.getContext("2d"), // new <canvas>
			w = 150,
			left = -50,
			top = -75;
		c.width = v.width = w * W / H;
		c.height = v.height = w;
		t.fillRect(0, 0, W, H); // draw black rect (default)
		n = 360; while(n--) { // go through hues
			var x = left + w,
				y = top + w;
			var g = t.createLinearGradient(x, top, x, y);
			g.addColorStop(0, "#000");
			g.addColorStop(.5, "hsl("+((n + 60) % 360)+",100%,50%)");
			g.addColorStop(1, "#FFF");
			t.beginPath(); // draw triangle
			t.moveTo(x, top);
			t.lineTo(x, y);
			t.lineTo(x + 2, y);
			t.lineTo(x + 5, top);
			t.fillStyle = g; // apply gradient
			t.fill();
			t.translate(x, y); // rotate + translate into position
			t.rotate((1 / 360) * Math.PI * 2);
			t.translate(-x, -y);
		}
		return v;
	})(), 0, 0)
}

</script>
