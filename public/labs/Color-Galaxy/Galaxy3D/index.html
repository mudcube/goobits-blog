<html><head>

<script src="scatter.js"></script>
<script src="test_colors.js"></script>
<script>

RGB_HSV=function(o) { var M=Math.max(o.R,o.G,o.B), delta=M-Math.min(o.R,o.G,o.B), H, S, V;

    if(M!=0) { S=Math.round(delta/M*100);

        if(o.R==M) H=(o.G-o.B)/delta; else if(o.G==M) H=2+(o.B-o.R)/delta; else if(o.B==M) H=4+(o.R-o.G)/delta;

        var H=Math.min(Math.round(H*60),360); if(H<0) H+=360;

    }

    return({'H':H?H:0, 'S':S?S:0, 'V':Math.round((M/255)*100)});

};

// conversion function borrowed from colorjack
var HSV_RGB = function(o) {
    var R, G, A, B, C, S=o.S/100, V=o.V/100, H=o.H/360;
    if(S>0) { if(H>=1) H=0;
        H=6*H; F=H-Math.floor(H);
        A=Math.round(255*V*(1-S));
        B=Math.round(255*V*(1-(S*F)));
        C=Math.round(255*V*(1-(S*(1-F))));
        V=Math.round(255*V); 
        switch(Math.floor(H)) {
            case 0: R=V; G=C; B=A; break;
            case 1: R=B; G=V; B=A; break;
            case 2: R=A; G=V; B=C; break;
            case 3: R=A; G=B; B=V; break;
            case 4: R=C; G=A; B=V; break;
            case 5: R=V; G=A; B=B; break;
        }
        return({'R':R?R:0, 'G':G?G:0, 'B':B?B:0, 'A':1});
    }
    else return({'R':(V=Math.round(V*255)), 'G':V, 'B':V, 'A':1});

};

var oScatter;

var initGraph = function() {

	// create a new graph in the container element
	oScatter = new ScatterGraph(document.getElementById("graph"));

	// set the target view point at (100,100,100). This is also the center of rotation.
	oScatter.setViewCenter({x:100, y:100, z:100});

	// set the initial rotation
	oScatter.setRotation({x:0, y:-135, z:0});

	// hide all points that are more than 200 units away (effectively hiding the back of the sphere)
	oScatter.setMaxZ(0);

	// move the "viewpoint" 1000 units back
	oScatter.setZoom(-1000);

	// 10 unit point size
	oScatter.setPointSize(2);

	oScatter.setStaticPointSize(true);

	// draw a solid sphere, size 100 units
	oScatter.setSolidSphere(100, "#444444")

	// set axis labels
	oScatter.setAxisXText("X");
	oScatter.setAxisYText("Y");
	oScatter.setAxisZText("Z");

	var aValues = []; // array of values to be plotted

	var fRadius = 100;
	for (var i in DB) {
		var oRGB = {
			R : DB[i][0],
			G : DB[i][1],
			B : DB[i][2]
		};

		var oHSV = RGB_HSV(oRGB);

		var fLat = ((oHSV.V / 100 * 180)-90) * Math.PI / 180;
		var fLong = (oHSV.H-180) * Math.PI / 180;

		var fX = -oHSV.S * Math.cos(fLat) * Math.cos(fLong);
		var fY =  oHSV.S * Math.sin(fLat);
		var fZ =  oHSV.S * Math.cos(fLat) * Math.sin(fLong);
 
		// create value structure
		var oValue = {
			x: fX + 100,
			y: fY + 100,
			z: fZ + 100,
			color : "rgb(" + Math.round(oRGB.R) + "," + Math.round(oRGB.G) + "," + Math.round(oRGB.B) + ")"
		};
		aValues.push(oValue);
	}

	// plot the data points
	oScatter.setData(aValues);

};

window.onload = initGraph;

document.onkeydown = function(e) {
	if (e.keyCode == 107) { // "+"
		oScatter.setZoom(
			Math.min(550, oScatter.getZoom() + 50)
		);
	}
	if (e.keyCode == 109) { // "-"
		oScatter.setZoom(
			Math.max(-1000, oScatter.getZoom() - 50)
		);
	}
}

</script><title>3D Scatter Graph</title></head><body>

<div id="graph" style="width: 400px; height: 400px; background-color: rgb(68, 68, 68);"><div style="width: 400px; height: 400px; position: absolute;"><div style="padding: 3px; color: white; font-size: 12px; font-family: verdana; position: absolute; left: 186.644px; top: 296.085px;">X</div><div style="padding: 3px; color: white; font-size: 12px; font-family: verdana; position: absolute; left: 268.91px; top: 272.059px;">Z</div><div style="padding: 3px; color: white; font-size: 12px; font-family: verdana; position: absolute; left: 60.106px; top: 29.5581px;">Y</div></div><canvas class="scatter" style="width: 400px; height: 400px; position: absolute;" height="400" width="400"></canvas><div style="width: 400px; height: 400px; position: absolute;"></div></div>

</body></html>
