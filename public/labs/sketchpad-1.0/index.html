<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" manifest="sketchpad.appcache" lang="">
<head>
    <title>Sketchpad - Online Paint/Drawing application</title>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8"/>
    <meta name="description" content="Sketchpad is an online drawing application -- written in &lt;canvas&gt;."/>
    <meta name="keywords" content=""/>
    <link rel="shortcut icon" href="/media/gui/favicon.ico" type="image/x-icon"/>
    <link rel="icon" href="media/gui/favicon.png" type="image/x-icon"/>
    <link rel="chrome-application-definition" href="sketchpad.json"/>
    <link rel="chrome-webstore-item"
          href="https://chrome.google.com/webstore/detail/lkllajgbhondgjjnhmmgbjndmogapinp"/>
    <link href="code/Sketchpad.css" rel="stylesheet" type="text/css"/>
    <script src="code/Data2Pattern.js" type="text/javascript"></script>
    <script src="code/gui.js" type="text/javascript"></script>
    <script src="code/Canvas2D.js" type="text/javascript"></script>
    <script src="code/dump.js" type="text/javascript"></script>
    <script src="code/global.js" type="text/javascript"></script>
    <script src="code/canvas.js" type="text/javascript"></script>
    <script src="code/gui-interface.js" type="text/javascript"></script>
    <script src="code/keypress.js" type="text/javascript"></script>
    <script src="code/tools.js" type="text/javascript"></script>
    <script src="code/tools-crop.js" type="text/javascript"></script>
    <script src="code/tools-draw.js" type="text/javascript"></script>
    <script src="code/Media.js" type="text/javascript"></script>
    <script src="code/Sketchpad.js" type="text/javascript"></script>
    <script src="code/App.js" type="text/javascript"></script>
</head>
<body>
    <div id="top">
        <div class="center">
            <div class="west" style="font-variant: small-caps">
                <div style="left: 12px; top: 10px" onmousedown="canvas.mode_sw('paint');" id="paint" class="cur">paint</div>
                <div style="left: 24px; top: 10px" onmousedown="canvas.mode_sw('light');" id="light">light</div>
            </div>
            <div class="east">
                <div style="background: none; border-left: none; border-right:1px solid #161616; height: 22px; padding: 0; cursor: default"></div>
                <div id="isolid" onmousedown="win.tab(this,'solid','solid'); if(this.className != 'cur') gui_swatch.toType('CO');">color</div>
                <div id="igradient" onmousedown="win.tab(this,'gradient','gradient'); if(this.className != 'cur') gui_swatch.toType('GD');">gradient</div>
                <div id="ipattern" onmousedown="win.tab(this,'pattern','pattern'); if(this.className != 'cur') gui_swatch.toType('PT');">pattern</div>
                <div id="iswatch" onmousedown="win.tab(this,'swatch',vars[vars.id])">swatch</div>
                <div id="ihistory" onmousedown="win.tab(this,'history',vars[vars.id])">history</div>
                <div id="ioptions" onmousedown="win.tab(this,'options',vars[vars.id])">options</div>
                <div onmousedown="canvas.open();" class="cur open" style="display:none"><span></span></div>
                <a href="#" onclick="window.saveDrawing(); return false;" target="_blank">
                    <div class="cur save"><span></span></div>
                </a>
                <div style="background: none; border-left: none; border: none; border-left:1px solid #3e3e3e; height: 22px; padding: 0; cursor: default"></div>
            </div>
        </div>
    </div>

    <div id="tools" class="gui">
        <div class="bounds">
            <div class="TL"></div>
            <div class="TM">
                <div class="TMM">tools</div>
            </div>
            <div class="TR"></div>
            <br/>
            <div class="ML"></div>
            <div class="MM" onmousedown="noMove();">
                <div class="z">
                    <div class="tools">
                        <div onclick="gui_tools.imageCurrent('Marquee_'+vars.marquee)">
                            <img src="media/gui/sw_add.png" class="plus" alt="Marquee"/><img src="" class="Marquee_lasso Marquee_ellipses Marquee_polygon Marquee_star Marquee_burst Marquee_gear" alt="Marquee"/>
                        </div>
                        <div onclick="gui_tools.imageCurrent('Crop')"><img src="" class="Crop" alt="Crop"/></div>
                        <br/>
                        <div class="hr"></div>
                        <div onclick="gui_tools.imageCurrent('Text')"><img src="" class="Text" alt="Text"/></div>
                        <div onclick="gui_tools.imageCurrent('Shape_'+vars.shape)">
                            <img src="media/gui/sw_add.png" class="plus" alt="Shape"/><img src="" class="Shape_ellipses Shape_polygon Shape_star Shape_burst Shape_gear" alt="Shape"/>
                        </div>
                        <div onclick="gui_tools.imageCurrent('Spirograph')"><img src="" class="Spirograph" alt="Spirograph"/></div>
                        <div onclick="gui_tools.imageCurrent(vars.draw)">
                            <img src="media/gui/sw_add.png" class="plus" alt="Draw"/><img src="" class="Brush Calligraphy Pencil" alt="Draw"/>
                        </div>
                        <div onclick="gui_tools.imageCurrent('Fill')"><img src="" class="Fill" alt="Fill"/></div>
                        <div onclick="gui_tools.imageCurrent('Stamp')"><img src="" class="Stamp" alt="Stamp"/></div>
                        <div onclick="gui_tools.imageCurrent('Eraser')"><img src="" class="Eraser" alt="Eraser"/></div>
                        <div onclick="gui_tools.imageCurrent('Picker')"><img src="" class="Picker" alt="Picker"/></div>
                        <br/>
                        <div class="hr"></div>
                    </div>
                    <div class="ss">
                        <div id="swap">F</div>
                        <div class="fill">
                            <canvas onmousedown="gui_palette.click('fill')" id="fill" title="Fill"></canvas>
                        </div>
                        <div class="stroke">
                            <canvas onmousedown="gui_palette.click('stroke')" id="stroke" title="Stroke"></canvas>
                            <div onmousedown="gui_palette.click('stroke')">
                                <div></div>
                            </div>
                            <img src="media/gui/sw_switch.png" style="display: block" onmousedown="gui_palette.current(); return false" alt="Switch Stroke with Fill"/>
                        </div>
                    </div>
                </div>
            </div>
            <div class="MR"></div>
            <br/>
            <div class="BL"></div>
            <div class="BM"></div>
            <div class="BR"></div>
        </div>
    </div>

    <div id="options" class="gui">
        <div class="bounds">
            <div class="TL"></div>
            <div class="TM">
                <span class="TML"></span>
                <div class="TRx">
                    <img onclick="win.close('options',1)" onmousedown="return(noMove())" src="media/gui/win_close.png" title="Close"/></div>
            </div>
            <div class="TR"></div>
            <br/>
            <div class="ML"></div>
            <div class="MM" onmousedown="noMove()"></div>
            <div class="MR"></div>
            <br/>
            <div class="BL"></div>
            <div class="BM"></div>
            <div class="BR"></div>
        </div>
    </div>

    <div id="history" class="gui">
        <div class="bounds">
            <div class="TL"></div>
            <div class="TM">
                <span class="TML">history</span>
                <div class="TRx">
                    <img onclick="win.close('history',1)" onmousedown="return(noMove())" src="media/gui/win_close.png" title="Close"/></div>
            </div>
            <div class="TR"></div>
            <br/>
            <div class="ML"></div>
            <div class="MM" onmousedown="noMove()"></div>
            <div class="MR"></div>
            <br/>
            <div class="BL"></div>
            <div class="BM"></div>
            <div class="BR"></div>
        </div>
    </div>

    <div id="swatch" class="gui">
        <div class="bounds">
            <div class="TL"></div>
            <div class="TM">
                <span class="TML">swatch</span>
                <div class="TRx">
                    <img onclick="win.close('swatch',1)" onmousedown="return(noMove())" src="media/gui/win_close.png" title="Close"/></div>
            </div>
            <div class="TR"></div>
            <br/>
            <div class="ML"></div>
            <div class="MM" onmousedown="noMove()"></div>
            <div class="MR"></div>
            <br/>
            <div class="BL"></div>
            <div class="BM"></div>
            <div class="BR"></div>
        </div>
    </div>

    <div id="pattern" class="gui">
        <div class="bounds">
            <div class="TL"></div>
            <div class="TM">
                <span class="TML">pattern</span>
                <div class="TRx">
                    <img onclick="win.close('pattern',1)" onmousedown="return(noMove())" src="media/gui/win_close.png" title="Close"/></div>
            </div>
            <div class="TR"></div>
            <br/>
            <div class="ML"></div>
            <div class="MM" onmousedown="noMove()">
                <div class="z"></div>
            </div>
            <div class="MR"></div>
            <br/>
            <div class="BL"></div>
            <div class="BM"></div>
            <div class="BR"></div>
        </div>
    </div>

    <div id="gradient" class="gui">
        <div class="bounds">
            <div class="TL"></div>
            <div class="TM">
                <span class="TML">gradient</span>
                <div class="TRx">
                    <img onclick="win.close('gradient',1)" onmousedown="return(noMove())" src="media/gui/win_close.png" title="Close"/>
                </div>
            </div>
            <div class="TR"></div>
            <br/>
            <div class="ML"></div>
            <div class="MM" onmousedown="noMove()"></div>
            <div class="MR"></div>
            <br/>
            <div class="BL"></div>
            <div class="BM"></div>
            <div class="BR"></div>
        </div>
    </div>

    <div id="solid" class="gui">
        <div class="bounds">
            <div class="TL"></div>
            <div class="TM">
                <span id="HEX" class="TML" title="HEX" style="cursor: text; text-transform:uppercase">FFFFFF</span>
                <div class="TRx">
                    <img onclick="win.close('solid',1)" onmousedown="return(noMove())" src="media/gui/win_close.png" title="Close"/></div>
            </div>
            <div class="TR"></div>
            <br/>
            <div class="ML"></div>
            <div class="MM" onmousedown="noMove()"></div>
            <div class="MR"></div>
            <br/>
            <div class="BL"></div>
            <div class="BM"></div>
            <div class="BR"></div>
        </div>
    </div>

    <div id="canvas" onmousedown="core.fu('canvas',event,{fu:core.win,Y1:19})" class="gui" style="width: 732px; height: 615px;">
        <div class="TL"></div>
        <div class="TM" ondblclick="win_size.tog(vars.winMax?'min':'max')">
            <div class="center">
                <span id="cTitle">DRAWING.PNG</span>
            </div>
            <div class="east" id="cZoom"></div>
        </div>
        <div class="TR"></div>
        <br/>
        <div class="ML"></div>
        <div class="MM">
            <div class="z">
                <div id="cBound" onmousedown="return(noMove())">
                    <canvas id="ctx_box" style="z-index: 1"></canvas>
                    <canvas id="ctx_temp" style="z-index: 2"></canvas>
                    <canvas id="ctx_active" style="z-index: 5"></canvas>
                    <canvas id="ctx_marquee" style="z-index: 6"></canvas>
                    <canvas id="ctx_mouse" style="z-index: 7"></canvas>
                </div>
                <canvas id="ctx_brush" width="200" height="200"></canvas>
                <canvas id="ctx_stamp" width="200" height="200"></canvas>
                <canvas id="ctx_eraser" width="200" height="200"></canvas>
                <canvas id="ctx_picker" height="1" width="1"></canvas>
                <div id="cHistory"></div>
            </div>
        </div>
        <div class="MR"></div>
        <br/>
        <div class="BL"></div>
        <div class="BM"></div>
        <div class="BR" onmousedown="vars.winMax='min'; win_size.core(event)"></div>
    </div>

    <div style="display: none" id="canvas_open">
        <div style="padding: 15px 0;">
            My Computer&hellip;<br><input type="file" id="local" size="17"><br><br>The Internet&hellip;<br><input type="datafile_url" id="server" size="27"><br><br><input onclick="canvas.open_event()" type="submit" value="open">
            <div id="canvas_open_error" style="padding: 4px 0 0 0; color: #ef3333"></div>
        </div>
    </div>
    <div class="ads">
        <a href="https://sketchpad.app" target="_blank">Sketchpad 2022 is out!</a>
    </div>
    <div id="TEST" style="color: #fff; position: absolute; top: 40px; z-index: 100000"></div>

    <!-- Google Analytics -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=UA-400768-7"></script>
    <script>
		window.dataLayer = window.dataLayer || [];

		function gtag() {dataLayer.push(arguments);}

		gtag('js', new Date());

		gtag('config', 'UA-400768-7');
    </script>
</body>
</html>
