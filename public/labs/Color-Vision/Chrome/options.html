<html>
<head><title>Daltonizing: Color-blind Accessibility</title></head>
<script type="text/javascript" src="./Color.Vision.Daltonize.js"></script>
<script type="text/javascript" src="./Color.Vision.Simulate.js"></script>
<script type="text/javascript">
// Restores forms to saved value from localStorage
function restore_session() {
	var input = document.getElementsByTagName("input");
	for(var n = 0, len = input.length; n < len; n ++) {
		if(localStorage[input[n].id] == "false") {
			input[n].checked = false;
		} else {
			input[n].checked = true;
		}
	}
	var select = document.getElementsByTagName("select");
	for(var n = 0, len = select.length; n < len; n ++) {
		for(var i = 0, length = select[n].length; i < length; i ++) {
			if(select[n][i].selected) {
				delete select[n][i].selected;
			} else if(localStorage[select[n].id] == select[n][i].innerHTML) {
				select[n][i].selected = "true";
			}
		}
	}
};
// Saves values
function saveSetting(type, value) {
	localStorage[type] = value;
	chrome.tabs.getSelected(null, function(tab) {
		chrome.tabs.sendRequest(tab.id, { }, function(response) {
			// send to content.js
		});
	});
};

function changeFavicon() {
	chrome.browserAction.setIcon({path: "./media/favicon_"+localStorage.CVD+".png"})
};
</script>
<style>
  body { color:#31333e; margin: 30px 0; font-family:Helvetica,Arial,sans-serif; font-size:1em; line-height:1.5em; }
  #content div { display: inline; line-height: 2em; }
  #content div.left { float: left; width: 40%; text-align: right; }
  #content div.right { float: left; width: 55%; margin-left: 5%; text-align: left; }
  a { color: #555555 }
  a:hover { color: #ef0000 }
</style>
<body onload="restore_session();">
<div style="width: 600px" id="content">
<div class="left">Filter type:</div><div class="right">&nbsp;<select onchange="saveSetting('TYPE', this.options[this.selectedIndex].innerHTML); changeFavicon();" id="TYPE"><option>Daltonize<option>Simulate</select></div><br>
<div class="left">Color vision deficiency:</div><div class="right">&nbsp;<select onchange="saveSetting('CVD', this.options[this.selectedIndex].innerHTML); changeFavicon();" id="CVD"><option>Protanope<option>Deuteranope<option>Tritanope</select></div><br>
<div class="left">Run at page load:</div><div class="right">&nbsp;<input onclick="saveSetting('isLoaded', this.checked)" type="checkbox" id="isLoaded"></div>
<div class="left">Show speed results:</div><div class="right">&nbsp;<input onclick="saveSetting('ShowTime', this.checked)" type="checkbox" id="ShowTime"></div>
<br style="clear:both">
<div style="height: 1px; margin: 10px 30px; display: block; background: #777;"></div>
<div style="margin: 10px 30px; display: block; font-style: italic;">
Find more useful tools on ColorJack&rsquo;s <a href="http://www.colorjack.com/software/">Software page</a>.
</div>
</div>
</body>
</html>
