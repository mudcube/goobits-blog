<body>
<script type="text/javascript" src="./ColorData.js"></script>
<script type="text/javascript" src="./Color.Vision.Daltonize.js"></script>
<script type="text/javascript" src="./Color.Vision.Simulate.js"></script>
<script type="text/javascript">

var Queue = [],
	Current = 0;

var runQueue = function() {
	chrome.tabs.getSelected(null, function(tab) {
		for(; Current < Queue.length; Current ++) {
			var src = Queue[Current];
			var image = document.createElement("img");
			image.onload = function() {
				var current = this.current;
				Color.Vision[localStorage.TYPE](this, {
					type: localStorage.CVD,
					callback: function(canvas) {
						var data = { id: current, data: canvas.toDataURL() };
						chrome.tabs.sendRequest(tab.id, data, function(response) {
							// send to content.js
						});
						document.body.appendChild(image);
						image.parentNode.removeChild(image);
					}
				});
			};
			image.current = Current;
			image.src = src;
		}
		// indicate queue is completed
		Current = 0;
	});
};

// default localStorage values
localStorage.TYPE = "Daltonize";
localStorage.CVD = "Protanope";
localStorage.ShowTime = "false";
localStorage.isLoaded = "false";

// add listener from content.js
chrome.extension.onRequest.addListener(function(request, sender, sendResponse) {
	switch(request.type) {
		case "getLocalStorage":
			sendResponse(localStorage);
			break;
		case "daltonize": 
			Queue = request.data;
			runQueue();
			sendResponse(Queue);
			break;
	}
});

// on nav-button click
chrome.browserAction.onClicked.addListener(function(tab) {
	chrome.tabs.getSelected(null, function(tab) {
		chrome.tabs.sendRequest(tab.id, { type: "navButton" }, function(response) {
			// send to content.js
		});
	});
});

// set navButton
chrome.browserAction.setIcon({path: "./favicon_"+localStorage.CVD+".png"})

</script>
</body>
