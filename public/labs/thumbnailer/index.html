<!DOCTYPE html>
<html>
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Batch Thumbnailer - Create Thumbnails in your Browser!</title>
    <!-- SketchAPI v3.6.10.8 -->
    <link href="min/sketchapi.min.css" type="text/css" rel="stylesheet"/>
    <script src="min/sketchapi.min.js" type="text/javascript"></script>
</head>
<body>
    <div id="content">
        <div id="download">Download</div>
        <h1>Batch Thumbnailer</h1>
        <div id="toolbar">
            <li>width
                <input id="width" type="number" onchange="sketch.runQueue('width', this)" onmouseup="sketch.runQueue('width', this)" onkeyup="sketch.runQueue('width', this)" value="300">
            </li>
            <li>height
                <input id="height" type="number" onchange="sketch.runQueue('height', this)" onmouseup="sketch.runQueue('height', this)" onkeyup="sketch.runQueue('height', this)" value="200">
            </li>
            <li>lock <input type="checkbox" onclick="sketch.runQueue('lock', this)"></li>
            <li>crop <select onchange="sketch.runQueue('crop', this)">
                <option>None
                <option>Fit
                <option selected>Edge
                <option>Stretch
            </select></li>
            <li>center <input type="checkbox" checked onclick="sketch.runQueue('center', this)"></li>
            <li>background
                <div id="backdrop" onclick="openPicker(event)">
            </li>
            <li>format <select onchange="sketch.runQueue('fileType', this)">
                <option selected>png
                <option>jpeg
            </select></li>
            <br>
        </div>
        <div id="thumbs"></div>
    </div>
    <!-- <img src="image2.jpg"/> -->
    <script>

		var openPicker = function (event) {
			var coords = eventjs.getCoord(event);
			colorPicker.toggle();
			colorPicker.picker.style.left = (coords.x - 150) + "px";
			colorPicker.picker.style.top = (coords.y + 15) + "px";
		};

		(function (root) {

			sketch.runQueue = function (type, that) {
				switch (type) {
					case "update":
						break;
					case "crop":
					case "fileType":
						config[type] = that.options[that.selectedIndex].innerHTML.toLowerCase();
						break;
					case "height":
					case "width":
						if (config[type] == parseInt(that.value)) return;
						config[type] = Math.min(2048, Math.max(1, parseInt(that.value))) || 1;
						that.value = config[type];
						if (config.lock) {
							config.width = config.height = config[type];
							document.getElementById("width").value = config.width;
							document.getElementById("height").value = config.height;
						}
						break;
					case "lock":
						if (that.checked) {
							config.width = config.height = Math.max(config.width, config.height);
							document.getElementById("width").value = config.width;
							document.getElementById("height").value = config.height;
						}
					case "center":
						if (config[type] == that.checked) return;
						config[type] = that.checked;
						break;
				}

				/// update the srcs
				var files = config.files;
				var parent = document.getElementById("thumbs");
				var dst = parent.getElementsByTagName("canvas");
				while (dst.length > files.length) {
					var element = dst[dst.length - 1];
					if (element) element.parentNode.removeChild(element);
				}
				for (var n = 0; n < files.length; n++) {
					var element = dst[n];
					var canvas = root.thumbnailer({
						canvas: element,
						crop: config.crop,
						center: config.center,
						width: config.width,
						height: config.height,
						background: config.background,
						croparea: [0, 0],
						//			maxWidth: 300,
						//			maxHeight: 300,
						//			minWidth: 10,
						//			minHeight: 10,
						src: files[n].src
					});

					if (!element) {
						eventjs.add(canvas, "mousedown", function (event) {
							var width = config.width;
							var height = config.height;
							eventjs.proxy.drag({
								position: "difference",
								event: event,
								target: canvas,
								listener: function (event, self) {
									eventjs.cancel(event);
									var x = Math.min(2048, Math.max(1, self.x + width));
									var y = Math.min(2048, Math.max(1, self.y + height));
									if (config.lock) x = y = Math.max(x, y);
									document.getElementById("width").value = x;
									document.getElementById("height").value = y;
									config.width = x;
									config.height = y;
									sketch.runQueue('update');
								}
							});
						});
						parent.appendChild(canvas);
					}
				}
			};

			var config = {};
			config.files = [{
				src: "./image2.jpg",
				name: "Testing"
			}];
			config.fileType = "png";
			config.crop = "edge";
			config.center = true;
			config.background = "rgba(0,0,0,1)";
			config.width = 300;
			config.height = 300;

			window.onload = function () {
				root.io = {};
				root.io.zip = new root.module.ZIP(root);
				root.thumbnailer = root.module.Thumbnailer;
				root.download = new root.module.Download(root);
				root.client = new root.module.Supports(root, function () {
					colorPicker = new Color.Picker({
						id: "ColorPicker",
						type: "HSLRGBA",
						foxybox: true,
						draggable: true,
						canvasWidth: 200,
						canvasHeight: 25,
						callback: function (rgb, hsl, state, type) {
							var hex = root.color.space({
								R: rgb.R,
								G: rgb.G,
								B: rgb.B,
								A: rgb.A / 100 * 255
							}, "RGBA>W3");
							var d = document.getElementById('backdrop');
							d.style.background = hex;
							config.background = hex;
							sketch.runQueue('update');
						}
					});
					colorPicker.toggle(false);
					///
					eventjs.add("#download", "click", function () {
						var files = [];
						var encoding = config.fileType;
						var mime = "image/" + encoding;
						var elements = document.querySelectorAll("#thumbs canvas");
						///
						var queue = new sketch.util.Queue({
							items: elements,
							oncomplete: function () {
								root.io.zip.encode(files, function (blob) {
									root.download.blob(blob, "package.zip");
								});
							},
							next: function (entry, key, index) {
								var file = config.files[key];
								var name = file.name;
								if (config.suffix) {
									name += config.suffix;
								} else { // append width + height
									name += "_" + entry.width + "x" + entry.height;
								}
								entry.toBlob(function (blob) {
									files.push({
										filename: name + "." + encoding,
										blob: blob
									});
									queue.next();
								}, mime, config.quality);
							}
						});
					});
					///
					var formats = ["jpg", "jpeg", "gif", "png", "svg"];
					///
					uploader = new root.util.Uploader({
						maxFiles: Infinity, // not required; default is 1
						formats: formats.join(","),
						dropArea: document.body,
						dropAreaMessage: '<div class="sk-uploader-anim"></div>\
			<div  class="sk-uploader-text">' +
							"Drop files here<br>\
                            <div><i>Accepted formats: </i><br>." + formats.join(" .") + '</div></p>\
		  </div>',
						onchange: function (self, event) {
							if (!self.files) return;
							///
							var addFile = function (src, name) {
								config.files.push({
									src: src,
									name: name
								});
								setTimeout(waitForEnd, 1);
							};

							var waitForEnd = function () {
								if (!--pending) {
									sketch.runQueue('update');
								}
								///
								var percent = Math.ceil((total - pending) / total * 100);
								timer.setValue(percent);
								if (percent >= 100) timer.hide();
							};
							///
							var files = self.files;
							var pending = 0;
							var total = root.util.count(files);
							///
							var timer = new root.ui.Timer({
								container: document.body,
								value: 0,
								endValue: 100,
								size: 120, // size in pixels
								format: "percent", // percent | time
								onstart: function () {
									config.files = [];
									///
									for (var key in files) {
										pending++;
										///
										var file = files[key];
										var name = file.name.split(".").slice(0, -1).join(".");
										///
										if (file.type === "image/svg+xml") {
											new root.vector.SVG({ //- simplify how this is...
												src: file.src,
												onerror: waitForEnd,
												onload: function (svg) {
													var canvas = root.util.Canvas();
													svg.render({
														ctx: canvas.ctx,
														width: canvas.width = svg.vob.width,
														height: canvas.height = svg.vob.height
													});
													canvas.toBlobURL(function (src) {
														addFile(src, name);
													});
												}
											});
										} else {
											addFile(file.src, name);
										}
									}
								}
							});
						}
					});
					//
					sketch.runQueue('update');
				});
			};

		})(sketch);

    </script>
    <!-- Google Analytics -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=UA-400768-7"></script>

		function gtag() {dataLayer.push(arguments);}

		gtag('js', new Date());

		gtag('config', 'UA-400768-7');
    </script>
</body>
</html>
