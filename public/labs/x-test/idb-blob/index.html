<script>
(function() {
	var db;
	function transaction() {
		var transaction = db.transaction(['elephants'], 'readwrite');
		return transaction.objectStore('elephants');
	};
	
	function getImageFile() {
		var xhr = new XMLHttpRequest();
		xhr.open('GET', 'idb-blob.png', true);
		xhr.responseType = 'blob';
		xhr.addEventListener('load', function() {
			if (xhr.status === 200) {
				putData(xhr.response);
			}
		}, false);
		xhr.send();
	};
	
	function handleStatus() {
		var tx = transaction();
		tx.get('image-status').onsuccess = function() {
			if (this.result === 'blob-written' && location.search !== '?reset') {
				console.log('blob-written');
				getData();
			} else {
				getImageFile();
			}
		};
	};

	function putData(blob) {
		var tx = transaction();
		tx.put(blob, 'image');
		tx.put('blob-written', 'image-status');
		getData();
	};
	
	function getData() {
		var tx = transaction();
		tx.get('image').onsuccess = function() {
			var blob = this.result;
			var src = URL.createObjectURL(blob);
			var image = new Image();
			image.src = src;
			document.body.appendChild(image);
			///
			requestAnimationFrame(function() {
				URL.revokeObjectURL(src);
			});
		};
	};

	var request = indexedDB.open('chrome-blob-test', 1.0);
	request.onerror = function(event) {
		console.log('Error creating/accessing IndexedDB database');
	};
	request.onsuccess = function(event) {
		db = request.result;
		db.onerror = function(event) {
			console.log('Error creating/accessing IndexedDB database');
		};
		handleStatus();
	}
	request.onupgradeneeded = function() {
		request.result.createObjectStore('elephants');
	};
})();
</script>
