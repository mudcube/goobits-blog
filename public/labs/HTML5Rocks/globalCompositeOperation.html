<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns = "http://www.w3.org/1999/xhtml">
<head>
<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
<title>ctx.globalCompositeOperation</title>
<link rel='stylesheet' href='http://fonts.googleapis.com/css?family=Oswald' type='text/css' media='all' />
<style type="text/css">
	body { background: #000; min-width: 740px; margin: 20px; font-family: Oswald; text-transform: uppercase; font-size: 1.5em; line-height: 2em }
	h3 { color: #fff; margin: 0; padding: 0 0 0 10px; display: inline; }
	canvas { border: 1px solid rgba(0, 0, 0, 0.15); border-radius: 3px; margin: 10px; }
</style>
</head>
<body>
<div>
  <div id="top-layer" style="width: 200px; float: left;">
    <h3>Top Layer</h3><br>
  </div>
  <div id="bottom-layer" style="width: 200px; float: left;">
    <h3>Bottom Layer</h3><br>
  </div>
  <div id="composite" style="clear: both">
  	<h3>Composite Modes</h3>
  </div>
  <div id="blend">
  	<h3>Blend Modes</h3>
  </div>
</div>
<script type="text/javascript">

var canvas1 = document.createElement("canvas");
var canvas2 = document.createElement("canvas");
var gco = [ "source-over","source-in","source-out","source-atop","destination-over","destination-in","destination-out","destination-atop","lighter","darker","copy","xor" ].reverse();
var gbo = [ "normal", "multiply", "screen", "overlay", "darken", "lighten", "color-dodge", "color-burn", "hard-light", "soft-light", "difference", "exclusion", "hue", "saturation", "color", "luminosity" ].reverse();;
var pixelRatio = window.devicePixelRatio || 1.0;
var width = 320 / 2.0 * pixelRatio;
var height = 340 / 2.0 * pixelRatio;

var runComposite = function(id, items) {
	while(items.length) {
		if ((items.length) % 4 === 0) appendBR(id);
		var gco = items.pop();
		var canvas = appendCanvas(id);
		var ctx = canvas.ctx;
		///
		ctx.drawImage(canvas1, 0, 0, width, height);
		ctx.globalCompositeOperation = gco;
		ctx.drawImage(canvas2, 0, 0, width, height);
		ctx.globalCompositeOperation = "source-over";
		ctx.fillStyle = "rgba(0,0,0,0.8)";
		ctx.fillRect(0, height - 20 * pixelRatio, width, 20 * pixelRatio);
		ctx.fillStyle = "#FFF";
		ctx.font = (14 * pixelRatio) + "px arial";
		ctx.fillText(gco, 5 * pixelRatio, height - 5* pixelRatio);
	}
};

var appendCanvas = function(id) {
	var canvas = document.createElement("canvas");
	canvas.style.background = "url(" + op_8x8.data + ")";
	canvas.width = width;
	canvas.height = height;
	canvas.ctx = canvas.getContext("2d");
	canvas.style.width = (width / pixelRatio) + "px";
	canvas.style.height = (height / pixelRatio) + "px";
	///
	var element = document.getElementById(id);
	element.appendChild(canvas);
	return canvas;
};

var appendBR = function(id) {
	var element = document.getElementById(id);
	element.appendChild(document.createElement("br"));
};

window.onload = function() {
	/// resize canvas
	canvas1.width = width;
	canvas1.height = height;
	canvas2.width = width;
	canvas2.height = height;
	///
	lightMix()
	colorSphere();
	///
	appendCanvas("top-layer").ctx.drawImage(canvas2, 0, 0, width, height);
	appendCanvas("bottom-layer").ctx.drawImage(canvas1, 0, 0, width, height);
	runComposite("composite", gco);
	runComposite("blend", gbo);
};

var lightMix = function() {
	var ctx = canvas2.getContext("2d");
	ctx.scale(pixelRatio / 2.0, pixelRatio / 2.0);
	ctx.save();
	ctx.globalCompositeOperation = "lighter";
	ctx.beginPath();
	ctx.fillStyle = "rgba(255,0,0,1)";
	ctx.arc(100, 200, 100, Math.PI * 2, 0, false);
	ctx.fill()
	ctx.beginPath();
	ctx.fillStyle = "rgba(0,0,255,1)";
	ctx.arc(220, 200, 100, Math.PI * 2, 0, false);
	ctx.fill()
	ctx.beginPath();
	ctx.fillStyle = "rgba(0,255,0,1)";
	ctx.arc(160, 100, 100, Math.PI * 2, 0, false);
	ctx.fill();
	ctx.restore();
	ctx.beginPath();
	ctx.fillStyle = "#f00";
	ctx.fillRect(0, 0, 30, 30)
	ctx.fill();
};

var colorSphere = function(element) {
	var ctx = canvas1.getContext("2d");
	ctx.scale(pixelRatio / 2.0, pixelRatio / 2.0);
	var width = 360;
	var halfWidth = width / 2.0;
	var rotate = 1.0 / 360 * Math.PI * 2.0; // per degree
	var offset = 0; // scrollbar offset
	var oleft = -20;
	var otop = -20;
	for (var n = 0; n <= 359; n ++) {
		var gradient = ctx.createLinearGradient(oleft + halfWidth, otop, oleft + halfWidth, otop + halfWidth);
		var color = Color.HSV_RGB({ H: (n + 300) % 360, S: 100, V: 100 });
		gradient.addColorStop(0, "rgba(0,0,0,0)");
		gradient.addColorStop(0.7, "rgba("+color.R+","+color.G+","+color.B+",1)");
		gradient.addColorStop(1, "rgba(255,255,255,1)");
		ctx.beginPath();
		ctx.moveTo(oleft + halfWidth, otop);
		ctx.lineTo(oleft + halfWidth, otop + halfWidth);
		ctx.lineTo(oleft + halfWidth + 6, otop);
		ctx.fillStyle = gradient;
		ctx.fill();
		ctx.translate(oleft + halfWidth, otop + halfWidth);
		ctx.rotate(rotate);
		ctx.translate(-(oleft + halfWidth), -(otop + halfWidth));
	}
	ctx.beginPath();
	ctx.fillStyle = "#00f";
	ctx.fillRect(15,15,30,30)
	ctx.fill();
	return ctx.canvas;
};

// HSV (1978) = H: Hue / S: Saturation / V: Value
Color = {};
Color.HSV_RGB = function (o) {
	var H = o.H / 360,
		S = o.S / 100,
		V = o.V / 100,
		R, G, B;
	var A, B, C, D;
	if (S == 0) {
		R = G = B = Math.round(V * 255);
	} else {
		if (H >= 1) H = 0;
		H = 6 * H;
		D = H - Math.floor(H);
		A = Math.round(255 * V * (1 - S));
		B = Math.round(255 * V * (1 - (S * D)));
		C = Math.round(255 * V * (1 - (S * (1 - D))));
		V = Math.round(255 * V);
		switch (Math.floor(H)) {
			case 0:
				R = V;
				G = C;
				B = A;
				break;
			case 1:
				R = B;
				G = V;
				B = A;
				break;
			case 2:
				R = A;
				G = V;
				B = C;
				break;
			case 3:
				R = A;
				G = B;
				B = V;
				break;
			case 4:
				R = C;
				G = A;
				B = V;
				break;
			case 5:
				R = V;
				G = A;
				B = B;
				break;
		}
	}
	return {
		R: R,
		G: G,
		B: B
	};
};

var createInterlace = function (size, color1, color2) {
	var proto = document.createElement("canvas").getContext("2d");
	proto.canvas.width = size * 2;
	proto.canvas.height = size * 2;
	proto.fillStyle = color1; // top-left
	proto.fillRect(0, 0, size, size);
	proto.fillStyle = color2; // top-right
	proto.fillRect(size, 0, size, size);
	proto.fillStyle = color2; // bottom-left
	proto.fillRect(0, size, size, size);
	proto.fillStyle = color1; // bottom-right
	proto.fillRect(size, size, size, size);
	var pattern = proto.createPattern(proto.canvas, "repeat");
	pattern.data = proto.canvas.toDataURL();
	return pattern;
};

var op_8x8 = createInterlace(8, "#FFF", "#eee");

</script>
