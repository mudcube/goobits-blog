<title>Crop, Rotate & Straighten</title>
<script src="babelHelpers.js"></script>
<link href="min/app-loader.min.css?2022.7.27.3" rel="stylesheet">
<script src="min/app-loader.min.js?2022.7.27.3"></script>

<body>
	<br>
	<span>scaleToFit:</span> <label for="scaleToFit"></label><input type="checkbox" id="scaleToFit" checked><br>
	<span>straighten:</span>
	<label for="straighten"></label><input type="range" step="any" id="straighten" value="0.1" min="-0.25" max="0.25"><br>
	<span>rotate:</span> <label for="rotate"></label><input type="range" id="rotate" value="0" step="0.01" min="-3.14" max="3.14"><br>
	<span>flipX:</span> <label for="flipX"></label><input type="checkbox" id="flipX"><br>
	<span>flipY:</span> <label for="flipY"></label><input type="checkbox" id="flipY"><br>
	<span>offsetX:</span> <label for="offsetX"></label><input type="range" step="any" id="offsetX" value="0" min="-1" max="1"><br>
	<span>offsetY:</span> <label for="offsetY"></label><input type="range" step="any" id="offsetY" value="0" min="-1" max="1"><br>
	<span>cropW:</span> <label for="cropW"></label><input type="range" step="any" id="cropW" value="1" min="0" max="1"><br>
	<span>cropH:</span> <label for="cropH"></label><input type="range" step="any" id="cropH" value="1" min="0" max="1"><br><br>
</body>
