		else if(b[0] in {'cpu':1,'cpv':1,'abu':1,'abv':1,'aeu':1,'aev':1}) { blind.custom[b[0]]=b[1]; }

	} } mkSlide(); mkFunc(); feedMe();
}

function mkSlide() { var o=['cpu','cpv','abu','abv','aeu','aev'], z='', b;

	for(var i in o) { b=parseFloat(blind.custom[o[i]]); z+='<div onmousedown="coreXY(\'slide'+i+'\',event,[93,0,0,0,-6],0,function(v,b) { var c=Math.min(Math.max((v[0]/(93/2))-1,-1),1); blind[\'custom\'][\''+o[i]+'\']=c; if(b==\'up\') mkFunc(); });" class="slide"><div id="slide'+i+'" style="left: '+Math.round((b+1)*(93/2))+'px">'+"<\/div><\/div><input id=\"in"+i+"\" value=\""+(Math.round(b*100)/100)+"\" style=\"display: none\">"; }

	$('slide').innerHTML=z; 
	
}

function mkRand() { var o=['cpu','cpv','abu','abv','aeu','aev'], b;

	for(var i in o) { b=(Math.random()*2); blind.custom[o[i]]=b-1; $S('slide'+i).left=Math.round(b*(93/2))+'px'; }

	mkFunc(); 

}

setTimeout("mkFunc(); mkBG(); mkSlide(); feedMe();",0);
