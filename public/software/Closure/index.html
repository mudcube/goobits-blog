	///
	var ret = {};
	var helper = {
		js: { // send javascript files to closure compiler.
			formats: "js",
			onload: function() {
			
			},
			onchange: function(self, event) {
				var form = document.getElementsByTagName("form")[0];
				var files = self.files;
				var js_code = "";
				for (var key in files) {
					var file = files[key];
					js_code += file.src;
				}
				/// Start loading indicator.
				loader = new widgets.Loader("Compiling, this may take a few minutes...");
				///
				setTimeout(function() {
					form.js_code.innerHTML = js_code;
					form.submit();
				}, 50);
			}
		},
		image: { // encode base64 images (was used to base64 the image above, but not active for this project).
			formats: "png,gif,jpeg,jpg",
			onchange: function(self, event) {
				var waitForEnd = function() {
					if (!--pending) { //-
						saveAs(new Blob([js_beautify(JSON.stringify(ret)), {
							type: "application/json"
						}]), "images.json");
					}
				};
				///
				var pending = 0;
				var files = self.files;
				for (var key in files) {
					var file = files[key];
					var image = new Image();
					image.onload = function() {
						var canvas = document.createElement("canvas");
						canvas.width = this.width;
						canvas.height = this.height;
						canvas.getContext('2d').drawImage(this, 0, 0);
						ret[this.getAttribute("key")] = canvas.toDataURL();
						waitForEnd();
//						console.log(this.getAttribute("key"));
//						console.log(canvas.toDataURL());
					};
					image.setAttribute("key", file.name);
					image.src = file.src;
					pending ++;
				}
			}
		}
	};
	///
	var loader;
	var hash = window.location.hash.substr(1);
	var action = helper[hash] || helper.js;
	/// Activate uploader.
	var uploader = new widget.Uploader({
		mode: "read", // "read" or "upload"
		maxFiles: Infinity,
		fakeInputParent: document.getElementById("button"),
		fakeInput: image,
		formats: action.formats,
		onChange: action.onchange,
		onLoad: function(self) {
			if (loader) loader.stop();
		}
	});
});
