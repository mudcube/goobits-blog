name = "calendar-site"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = ".svelte-kit/cloudflare"

# Pages will be deployed via `wrangler pages deploy`.
# Replace placeholder resource names/IDs during the production cutover phase.

[[d1_databases]]
binding = "DB"
database_name = "calendar-site-db"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "../../packages/calendar/migrations/sql"

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "calendar-site-media"
preview_bucket_name = "calendar-site-media-preview"

[vars]
PUBLIC_BASE_URL = "https://pdx.fun"
PUBLIC_TURNSTILE_SITE_KEY = ""
MEDIA_PUBLIC_BASE = "https://media.pdx.fun"

# Secrets belong in the environment manager for this app:
# GOOGLE_CLIENT_SECRET, PAYPAL_CLIENT_SECRET, SQUARE_ACCESS_TOKEN,
# TOKEN_ENC_KEY, TURNSTILE_SECRET_KEY, CALENDAR_SYNC_CRON_SECRET, etc.
