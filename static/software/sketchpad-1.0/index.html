<head><meta name="msapplication-config" content="./sketchpad-1.0.8ee90d25.xml"><meta name="theme-color" content="#add8e6"><link rel="icon" sizes="32x32" href="./sketchpad-1.0.4ae79131.png"><link rel="icon" sizes="16x16" href="./sketchpad-1.0.f49f9fc1.png"><link rel="apple-touch-icon" sizes="180x180" href="./sketchpad-1.0.0c237cbe.png"><link rel="manifest" href="./sketchpad-1.0.855325af.webmanifest">
    <title>Sketchpad - Online Paint/Drawing application</title>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="description" content="Sketchpad is an online drawing application -- written in &lt;canvas&gt;.">
    <meta name="keywords" content="">
    <link rel="icon" href="./favicon.d280c99d.png" type="image/x-icon">
    <link rel="chrome-application-definition" href="./sketchpad.6e82cfe8.js">
    <link rel="chrome-webstore-item" href="https://chrome.google.com/webstore/detail/lkllajgbhondgjjnhmmgbjndmogapinp">
    <link href="./index.369072bc.css" rel="stylesheet" type="text/css">
	<script src="./index.62a6bf4c.js"></script>
    <script src="./index.56652fcf.js"></script>
    <script src="./index.869e5152.js"></script>
    <script src="./index.f6567975.js"></script>
    <script src="./index.cecdc2ea.js"></script>
    <script src="./index.6c182b8e.js"></script>
    <script src="./index.a34ed19a.js"></script>
    <script src="./index.10a82381.js"></script>
    <script src="./index.d294cae3.js"></script>
    <script src="./index.edd184ef.js"></script>
    <script src="./index.d3a52f11.js"></script>
    <script src="./index.faaf96a3.js"></script>
    <script src="./index.384ad77c.js" defer=""></script>
</head>
<body>
    <div id="top">
        <div class="center">
            <div class="west" style="font-variant: small-caps">
                <div style="top: 10px; left: 12px" onmousedown="canvas.mode_sw('paint');" id="paint" class="cur">paint</div>
                <div style="top: 10px; left: 24px" onmousedown="canvas.mode_sw('light');" id="light">light</div>
            </div>
            <div class="east">
                <div style="height: 22px; cursor: default; background: none; border-left: none; border-right: 1px solid #161616; padding: 0"></div>
                <div id="isolid" onmousedown="win.tab(this,'solid','solid'); if(this.className != 'cur') gui_swatch.toType('CO');">color</div>
                <div id="igradient" onmousedown="win.tab(this,'gradient','gradient'); if(this.className != 'cur') gui_swatch.toType('GD');">gradient</div>
                <div id="ipattern" onmousedown="win.tab(this,'pattern','pattern'); if(this.className != 'cur') gui_swatch.toType('PT');">pattern</div>
                <div id="iswatch" onmousedown="win.tab(this,'swatch',vars[vars.id])">swatch</div>
                <div id="ihistory" onmousedown="win.tab(this,'history',vars[vars.id])">history</div>
                <div id="ioptions" onmousedown="win.tab(this,'options',vars[vars.id])">options</div>
                <div onmousedown="canvas.open();" class="cur open" style="display: none"><span></span></div>
                <a href="javascript:" onclick="window.saveDrawing(); return false;">
                    <div class="cur save"><span></span></div>
                </a>
                <div style="height: 22px; cursor: default; background: none; border: none; border-left: 1px solid #3e3e3e; padding: 0"></div>
            </div>
        </div>
    </div>

    <div id="tools" class="gui">
        <div class="bounds">
            <div class="TL"></div>
            <div class="TM">
                <div class="TMM">tools</div>
            </div>
            <div class="TR"></div>
            <br>
            <div class="ML"></div>
            <div class="MM" onmousedown="noMove();">
                <div class="z">
                    <div class="tools">
                        <div onclick="gui_tools.imageCurrent('Marquee_'+vars.marquee)">
                            <img src="./sw_add.07de4956.png" class="plus" alt="Marquee"><img src="#" class="Marquee_lasso Marquee_ellipses Marquee_polygon Marquee_star Marquee_burst Marquee_gear" alt="Marquee">
                        </div>
                        <div onclick="gui_tools.imageCurrent('Crop')"><img src="#" class="Crop" alt="Crop"></div>
                        <br>
                        <div class="hr"></div>
                        <div onclick="gui_tools.imageCurrent('Text')"><img src="#" class="Text" alt="Text"></div>
                        <div onclick="gui_tools.imageCurrent('Shape_'+vars.shape)">
                            <img src="./sw_add.07de4956.png" class="plus" alt="Shape"><img src="#" class="Shape_ellipses Shape_polygon Shape_star Shape_burst Shape_gear" alt="Shape">
                        </div>
                        <div onclick="gui_tools.imageCurrent('Spirograph')"><img src="#" class="Spirograph" alt="Spirograph"></div>
                        <div onclick="gui_tools.imageCurrent(vars.draw)">
                            <img src="./sw_add.07de4956.png" class="plus" alt="Draw"><img src="#" class="Brush Calligraphy Pencil" alt="Draw">
                        </div>
                        <div onclick="gui_tools.imageCurrent('Fill')"><img src="#" class="Fill" alt="Fill"></div>
                        <div onclick="gui_tools.imageCurrent('Stamp')"><img src="#" class="Stamp" alt="Stamp"></div>
                        <div onclick="gui_tools.imageCurrent('Eraser')"><img src="#" class="Eraser" alt="Eraser"></div>
                        <div onclick="gui_tools.imageCurrent('Picker')"><img src="#" class="Picker" alt="Picker"></div>
                        <br>
                        <div class="hr"></div>
                    </div>
                    <div class="ss">
                        <div id="swap">F</div>
                        <div class="fill">
                            <canvas onmousedown="gui_palette.click('fill')" id="fill" title="Fill"></canvas>
                        </div>
                        <div class="stroke">
                            <canvas onmousedown="gui_palette.click('stroke')" id="stroke" title="Stroke"></canvas>
                            <div onmousedown="gui_palette.click('stroke')">
                                <div></div>
                            </div>
                            <img src="./sw_switch.b4398023.png" style="display: block" onmousedown="gui_palette.current(); return false" alt="Switch Stroke with Fill">
                        </div>
                    </div>
                </div>
            </div>
            <div class="MR"></div>
            <br>
            <div class="BL"></div>
            <div class="BM"></div>
            <div class="BR"></div>
        </div>
    </div>

    <div id="options" class="gui">
        <div class="bounds">
            <div class="TL"></div>
            <div class="TM">
                <span class="TML"></span>
                <div class="TRx">
                    <img onclick="win.close('options',1)" onmousedown="return(noMove())" src="./win_close.040418f9.png" title="Close"></div>
            </div>
            <div class="TR"></div>
            <br>
            <div class="ML"></div>
            <div class="MM" onmousedown="noMove()"></div>
            <div class="MR"></div>
            <br>
            <div class="BL"></div>
            <div class="BM"></div>
            <div class="BR"></div>
        </div>
    </div>

    <div id="history" class="gui">
        <div class="bounds">
            <div class="TL"></div>
            <div class="TM">
                <span class="TML">history</span>
                <div class="TRx">
                    <img onclick="win.close('history',1)" onmousedown="return(noMove())" src="./win_close.040418f9.png" title="Close"></div>
            </div>
            <div class="TR"></div>
            <br>
            <div class="ML"></div>
            <div class="MM" onmousedown="noMove()"></div>
            <div class="MR"></div>
            <br>
            <div class="BL"></div>
            <div class="BM"></div>
            <div class="BR"></div>
        </div>
    </div>

    <div id="swatch" class="gui">
        <div class="bounds">
            <div class="TL"></div>
            <div class="TM">
                <span class="TML">swatch</span>
                <div class="TRx">
                    <img onclick="win.close('swatch',1)" onmousedown="return(noMove())" src="./win_close.040418f9.png" title="Close"></div>
            </div>
            <div class="TR"></div>
            <br>
            <div class="ML"></div>
            <div class="MM" onmousedown="noMove()"></div>
            <div class="MR"></div>
            <br>
            <div class="BL"></div>
            <div class="BM"></div>
            <div class="BR"></div>
        </div>
    </div>

    <div id="pattern" class="gui">
        <div class="bounds">
            <div class="TL"></div>
            <div class="TM">
                <span class="TML">pattern</span>
                <div class="TRx">
                    <img onclick="win.close('pattern',1)" onmousedown="return(noMove())" src="./win_close.040418f9.png" title="Close"></div>
            </div>
            <div class="TR"></div>
            <br>
            <div class="ML"></div>
            <div class="MM" onmousedown="noMove()">
                <div class="z"></div>
            </div>
            <div class="MR"></div>
            <br>
            <div class="BL"></div>
            <div class="BM"></div>
            <div class="BR"></div>
        </div>
    </div>

    <div id="gradient" class="gui">
        <div class="bounds">
            <div class="TL"></div>
            <div class="TM">
                <span class="TML">gradient</span>
                <div class="TRx">
                    <img onclick="win.close('gradient',1)" onmousedown="return(noMove())" src="./win_close.040418f9.png" title="Close">
                </div>
            </div>
            <div class="TR"></div>
            <br>
            <div class="ML"></div>
            <div class="MM" onmousedown="noMove()"></div>
            <div class="MR"></div>
            <br>
            <div class="BL"></div>
            <div class="BM"></div>
            <div class="BR"></div>
        </div>
    </div>

    <div id="solid" class="gui">
        <div class="bounds">
            <div class="TL"></div>
            <div class="TM">
                <span id="HEX" class="TML" title="HEX" style="cursor: text; text-transform: uppercase">FFFFFF</span>
                <div class="TRx">
                    <img onclick="win.close('solid',1)" onmousedown="return(noMove())" src="./win_close.040418f9.png" title="Close"></div>
            </div>
            <div class="TR"></div>
            <br>
            <div class="ML"></div>
            <div class="MM" onmousedown="noMove()"></div>
            <div class="MR"></div>
            <br>
            <div class="BL"></div>
            <div class="BM"></div>
            <div class="BR"></div>
        </div>
    </div>

    <div id="canvas" onmousedown="core.fu('canvas',event,{fu:core.win,Y1:19})" class="gui" style="width: 732px; height: 615px">
        <div class="TL"></div>
        <div class="TM" ondblclick="win_size.tog(vars.winMax?'min':'max')">
            <div class="center">
                <span id="cTitle">DRAWING.PNG</span>
            </div>
            <div class="east" id="cZoom"></div>
        </div>
        <div class="TR"></div>
        <br>
        <div class="ML"></div>
        <div class="MM">
            <div class="z">
                <div id="cBound" onmousedown="return(noMove())">
                    <canvas id="ctx_box" style="z-index: 1"></canvas>
                    <canvas id="ctx_temp" style="z-index: 2"></canvas>
                    <canvas id="ctx_active" style="z-index: 5"></canvas>
                    <canvas id="ctx_marquee" style="z-index: 6"></canvas>
                    <canvas id="ctx_mouse" style="z-index: 7"></canvas>
                </div>
                <canvas id="ctx_brush" width="200" height="200"></canvas>
                <canvas id="ctx_stamp" width="200" height="200"></canvas>
                <canvas id="ctx_eraser" width="200" height="200"></canvas>
                <canvas id="ctx_picker" height="1" width="1"></canvas>
                <div id="cHistory"></div>
            </div>
        </div>
        <div class="MR"></div>
        <br>
        <div class="BL"></div>
        <div class="BM"></div>
        <div class="BR" onmousedown="vars.winMax='min'; win_size.core(event)"></div>
    </div>

    <div style="display: none" id="canvas_open">
        <div style="padding: 15px 0">
            My Computer&hellip;<br><input type="file" id="local" size="17"><br><br>The Internet&hellip;<br><input type="datafile_url" id="server" size="27"><br><br><input onclick="canvas.open_event()" type="submit" value="open">
            <div id="canvas_open_error" style="color: #ef3333; padding: 4px 0 0"></div>
        </div>
    </div>
    <div class="ads">
        <a href="https://sketchpad.app" target="_blank">Sketchpad 2025 is out!</a>
    </div>
    <div id="TEST" style="color: #fff; z-index: 100000; position: absolute; top: 40px"></div>

</body>
