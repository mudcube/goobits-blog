<!DOCTYPE html>
<html>
<head>
<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
<title>CSS Text-Metrics</title>
<style type="text/css">
	body { margin: 0; font-family: papyrus; list-style-type: circle; }
	span { background: #ff8; padding: 0 1px }
</style>
<script>

window.onload = function() {
	
	// setting up html used for measuring text-metrics
	var container = document.getElementById("container");
	var parent = document.createElement("span");
	var image = document.createElement("img");
	image.width = 42;
	image.height = 1;
	image.setAttribute('valign','absmiddle')
	image.src = "./media/1x1.png";
	parent.appendChild(document.createTextNode("TheQuickBrownFox!"));
	parent.appendChild(image);
	container.appendChild(parent);
	
	// getting css equivalent of ctx.measureText()
	image.style.display = "none";
	parent.style.display = "inline";

	var measureHeight = parent.offsetHeight;
	var measureWidth = parent.offsetWidth;

	// making sure super-wide text stays in-bounds
	image.style.display = "inline";
	var forceWidth = measureWidth + image.offsetWidth;

	// capturing the "top" and "bottom" baseline
	parent.style.cssText = "margin: 50px 0; display: block; width: " + forceWidth + "px";
	var TopCSS = image.offsetTop - 49;
	var HeightCSS = parent.offsetHeight;
	var BottomCSS = TopCSS - HeightCSS;

	// capturing the "middle" baseline
	parent.style.cssText = "display: inline; width: " + forceWidth + "px";
	parent.style.lineHeight = 0;
//	image.style.verticalAlign = "middle";
	var MiddleCSS = image.offsetTop + 1;

	// writing results to html
	parent.style.cssText = ""; // reset css
	writeTo.innerHTML += "<div style='height: 15px'></div>";
	write("<li>&ldquo;font-size&rdquo;:", parseInt(document.body.style.fontSize));
	write("<li>&ldquo;alphabetic&rdquo; baseline:", 0);
	write("<li>&ldquo;top&rdquo; baseline:", TopCSS);
	write("<li>&ldquo;middle&rdquo; baseline:", MiddleCSS);
	write("<li>&ldquo;bottom&rdquo; baseline:", BottomCSS);
	write("<li>measureText.height:", measureHeight);
	write("<li>measureText.width:", measureWidth);
	writeTo.innerHTML += "<div style='height: 15px'></div>";
	write("<i>These values can be plugged into &lt;canvas&gt; fixing ctx.textBaseline/ctx.measureText support.</i>");
	write("<i>These values are reproducable in browsers as old as 2004, before &lt;canvas&gt; was implemented. </i>");
	write("<i>IE 6.0+, Firefox 1.0+, Opera 9.0+, Safari 3.0+, Chrome 5.0+.</i>");
	write("<i>Read more: <a href='/journal/'>/journal/</a></i>");
	writeTo.style.fontSize = "20px";
	writeTo.style.lineHeight = "30px";
	document.body.appendChild(writeTo);
	document.body.style.margin = "20px";

};

var writeTo = document.createElement("div");
var write = function() {
	var text = "";
	for (var n = 0, length = arguments.length; n < length; n ++) {
		if (typeof(arguments[n]) == "number") {
			text += "<span>" + arguments[n] + "px</span>";
		} else {
			text += arguments[n] + " ";
		}
	}
	writeTo.innerHTML += text + "<br>";
};

</script>
</head>
<body style="font-family: futura; font-size: 152px;">
<div style="background: #eeffee" id="container"></div>
</body>
</html>
