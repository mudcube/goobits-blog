<head>
	<meta http-equiv="content-type" content="text/html; charset=utf-8"/>
	<style>body {
		margin: 0
	}</style>
	<!-- #start-code -->
	<script src="/?basic&dat-gui"></script>
	<!-- #end-code -->
	<script src="./TextInPath.js"></script>
</head>
<body>
	<canvas id="canvas" style="position: absolute;"></canvas>
	<script>
		window.onload = function () {
			ctx = document.getElementById("canvas").getContext("2d");
			gui = new dat.GUI({autoPlace: true});
			gui.add(style, "fontSize", 1, 30).onChange(function (value) {
				textInPath(ctx);
			});
			gui.add(style, "lineHeight", 1, 30).onChange(function (value) {
				textInPath(ctx);
			});
			gui.add(style, "padLeft", 1, 100).onChange(function (value) {
				textInPath(ctx);
			});
			gui.add(style, "padTop", 1, 100).onChange(function (value) {
				textInPath(ctx);
			});
			gui.add(style, "padRight", 1, 100).onChange(function (value) {
				textInPath(ctx);
			});
			gui.add(style, "padBottom", 1, 100).onChange(function (value) {
				textInPath(ctx);
			});
			///
			textInPath(ctx);
		};
	</script>
</body>
