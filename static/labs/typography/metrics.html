<!DOCTYPE html>
<html>
<head>
<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
<title>Typographic Metrics</title>
<style type="text/css">
	body { margin: 0; font-family: papyrus; list-style-type: circle; }
	span { background: #ff8; padding: 0 1px }
</style>
<script>

var container;
var control;
var image;

(function() {

var direction = ""; // ltr, or rtl
var whois = "jiraffe!|";
var fontFamily = "arial";
var fontSize = 42;
var bboxHeight = 0; // size of text bounding-height
var bboxWidth = 0; // size of text bounding-width
var ascent = 0;
var descent = 0;
var emHeight = 0; // size of em-height (via measuring offsetTop of element below line-height=0)
var enHeight = 0; // size of en-height

/* left and right alignment
------------------------------*/

function getAlign(text, type, offsetx) {
    switch(type) {
        case "left": break;
        case "start": offsetx -= (direction == 'ltr') ? 0 : bboxWidth; break;
        case "end": offsetx -= (direction == 'ltr') ? bboxWidth : 0; break;
        case "right": offsetx -= bboxWidth; break;
        case "center": offsetx -= bboxWidth / 2; break;
    }
    return offsetx;
};

/* placement of text baseline
--------------------------------*/

function getBaseline(type, offsety) {
    switch(type) {
        case "alphabetic": break; // alphabetic baseline
        case "top": offsety += ascent; break; // top of em box
        case "hanging": offsety += ascent * 8.0 / 10.0; break; // hanging baseline
        case "middle": offsety += emHeight / 2.0; break; // middle of em box
        case "ideographic": offsety -= descent; break; // ideographic baseline
        case "bottom": offsety -= descent; break; // bottom of em box
        default: break;
    }
    return offsety;
};

/* measuring text height and width
------------------------------*/

function measureText(text) {
	control.style.display = "inline";
	control.textContent = text;
	return {
		height: control.offsetHeight,
		width: control.offsetWidth
	};
};

/* line and letter breaks
------------------------------*/

function getLines(text, maxWidth) {
	var returns = text.split("\n");
	var lines = [];
	var lastPhrase = "";
	function splitWord() {
		var width = measureText(lastPhrase).width;
		var posA = 0;
		var posZ = 0;
		if (width > maxWidth) {
			for (var n = 0, length = lastPhrase.length; n < length; n ++) {
				var width = measureText(lastPhrase.substr(posA, posZ ++)).width;
				if (width > maxWidth) {
					lines.push(lastPhrase.substr(posA, posZ - 2));
					posA = n - 1;
					posZ = 2;
				}
			}
			return lastPhrase.substr(posA, posZ + 2);
		}
	};
	for (var n = 0; n < returns.length; n++) {
		if (lastPhrase) lines.push(lastPhrase);
		var phrase = returns[n];
		var spaces = phrase.split(" ");
		var lastPhrase = "";
		for (var i = 0; i < spaces.length; i++) {
			var measure = measureText(lastPhrase + " " + spaces[i]).width;
			if (measure < maxWidth) {
				lastPhrase += ((lastPhrase ? " " : "") + spaces[i]);
			} else {
				if (measure > maxWidth) {
					var split = splitWord();
					if (split) {
						lastPhrase = split + " " + spaces[i];
					} else {
						lines.push(lastPhrase);			
						lastPhrase = spaces[i];
					}
				}
			}
			if (i == spaces.length - 1) {
				lines.push(lastPhrase);
				lastPhrase = "";
				break;
			}
		}
	}
	return lines;
};

function getTextMetrics() {
	// capturing the "direction" the text is going
	direction = window.getComputedStyle(document.body, "")["direction"];

	// setting up html used for measuring text-metrics
	container = document.getElementById("container");
	control = document.createElement("span");
	image = document.createElement("img");
	image.width = 42;
	image.height = 1;
	image.src = "./media/1x1.png";
	control.appendChild(document.createTextNode(whois));
	control.appendChild(image);
	container.appendChild(control);
	
	// getting css equivalent of ctx.measureText()
	image.style.display = "none";
	control.style.display = "inline";
	bboxHeight = control.offsetHeight;
	bboxWidth = control.offsetWidth;

	// making sure super-wide text doesn't wrap
	image.style.display = "inline";
	var forceWidth = bboxWidth + image.offsetWidth;

	// capturing the "top" and "bottom" baseline
	control.style.cssText = "margin: 50px 0; display: block; width: " + forceWidth + "px";
	var TopBaseline = image.offsetTop - 49;
	var HeightCSS = control.offsetHeight;
	var BottomBaseline = TopBaseline - HeightCSS;

	// capturing the "middle" baseline
	control.style.cssText = "line-height: 0; display: block; width: " + forceWidth + "px";
	var MiddleBaseline = image.offsetTop + 1;

	// calculate "em" and "en" height
	emHeight = (MiddleBaseline - 0.5) * 2;
	enHeight = emHeight / 2;


	// calculating the ascent and descent
	descent = -BottomBaseline;
	ascent = TopBaseline;
};

window.onload = function() {
	getTextMetrics();
	runDemos();
	control.textContent = "Typographic metrics in <canvas>";
};

/* demos
----------------------------------------------------*/

function runDemos() {
	// drawing demos
	var hash = window.location.hash;
	if (!hash || hash == "#textBaseline") {
		// text-baseline demos
		textBaselineDemo("rgba(255,0,0,0.04)", baseline, 0, true);
		textBaselineDemo("rgba(0,255,0,0.06)", baseline, 0, false);
	}
	if (!hash || hash == "#textAlign") {
		// text-align demos
		textAlignDemo("rgba(255,0,0,0.04)", true);
		textAlignDemo("rgba(0,255,0,0.04)", false);
	}
	if (!hash || hash == "#lineBreak") {
		textBreakDemo("rgba(0,255,0,0.04)");
	}
	control.style.cssText = "";
	document.body.style.margin = "20px";
};


/* text baseline demo - iterates through each baseline
----------------------------------------------------*/

var baseline = [ 'ideographic', 'bottom', 'alphabetic', 'middle', 'top', 'hanging' ];

function textBaselineDemo(color, text, length, nativeBaseline) {
	var c = document.createElement("canvas");
	c.style.cssText = "background: "+color+"; margin-bottom: 10px";
	document.body.appendChild(c);
	var multiplier = 1;
	var middle = bboxHeight * multiplier;
	var offset = 10;
	var innerWidth = window.innerWidth - 55;
	c.width = innerWidth;
	c.height = middle * 2 + offset * 2;
	ctx = c.getContext("2d");
	ctx.font = "bold 14px arial";
	ctx.fillText((nativeBaseline ? "native" : "emulation") + " ctx.textBaseline", 5, 16);
	ctx.font = fontSize + "px " + fontFamily;
	var width = 0;
	var n = 0;
	if (length) {
		var isArray = false;			
	} else {
		length = text.length;
		var isArray = true;
	}
	ctx.fillStyle = "rgba(0,0,0,0.5)"
	ctx.fillRect(0, (middle - enHeight + offset >> 0), innerWidth, 1);
	ctx.fillRect(0, (middle + enHeight + offset >> 0), innerWidth, 1);
	ctx.fillStyle = "rgba(0,0,255,0.1)";
	for (var n = 1; n < 4; n ++ ) {
		ctx.fillRect(0, middle - emHeight*n + offset + 0.5, innerWidth, 1);
		ctx.fillRect(0, middle + emHeight*n + offset + 0.5, innerWidth, 1);
	}
	ctx.fillStyle = "rgba(255,0,0,0.5)"
	ctx.fillRect(0, middle + offset, innerWidth, 1);
	while(length--) {
		var offsety = 0;
		if (nativeBaseline) {
			ctx.textBaseline = baseline[length];
		} else {
			offsety = getBaseline(baseline[length], offsety);
			console.log(baseline[length], offsety)
		}
		///
		var red = (length / baseline.length) * 360 >> 0;
		ctx.fillStyle = "rgba("+red+", 0, 0, 1.0)";
		///
		var tmp = (isArray ? "jfx"+baseline[length] : text);
		ctx.fillText(tmp, width, bboxHeight * multiplier + offset + offsety);
		width += measureText(tmp).width + 10;
	}	
};

/* text alignment demo - calculates textAlign using dimensions of font-face 
// http://www.w3.org/TR/css3-linebox/#FontBaseline 
--------------------------------------------------------*/

var align = [ 'left', 'right', 'center' ];

function textAlignDemo(color, nativeAlign) {
	var c = document.createElement("canvas");
	c.style.cssText = "background: "+color+"; margin-bottom: 10px";
	document.body.appendChild(c);
	var length = align.length;
	var innerWidth = window.innerWidth - 55;
	c.width = innerWidth;
	c.height = bboxHeight * align.length + 25;
	ctx = c.getContext("2d");
	ctx.font = "bold 14px arial";
	ctx.fillText((nativeAlign ? "native" : "emulation") + " ctx.textAlign", 5, 16);
	ctx.font = fontSize + "px " + fontFamily;
	while(length--) {
		var red = (length / baseline.length) * 360 >> 0;
		ctx.fillStyle = "rgba("+red+", 0, 0, 1.0)";
		var offsetx = 0;
		if (nativeAlign) ctx.textAlign = align[length];
		offsetx = getAlign(whois, align[length], offsetx);
		ctx.fillRect(300 + offsetx, 0, 1, c.height);
		if (nativeAlign) offsetx = 0;
		ctx.fillText(whois, 300 + offsetx, bboxHeight + length * bboxHeight);
	}
};

/* text break demo
--------------------------------------------------------*/

var text = '"The quick brown fox jumps over the lazy dog" is an English-language pangram, that is, a phrase that contains all of the letters of the alphabet. \n\n Now let\'s test letter-wrapping a—suuperlongwordthathasnoboundswithinitself.';

function textBreakDemo(color) {
	var c = document.createElement("canvas");
	c.style.cssText = "background: "+color+"; margin-bottom: 10px";
	document.body.appendChild(c);
	var length = align.length;
	var innerWidth = window.innerWidth - 55;
	c.width = innerWidth;
	c.height = bboxHeight * (align.length + 2);
	ctx = c.getContext("2d");
	//
	var maxWidth = 400;
	var offsety = getBaseline("top", 0);
	ctx.font = fontSize + "px " + fontFamily;
	var lines = getLines(text + " ", maxWidth);
	c.height = lines.length * bboxHeight;
	ctx.font = fontSize + "px " + fontFamily;
	ctx.strokeStyle = "#f00";
	ctx.strokeRect(0, 0, maxWidth, c.height);
	ctx.fillStyle = "#000";
	for (var n = 0, length = lines.length; n < length; n ++) {
		ctx.fillText(lines[n], 0, (n * bboxHeight) + offsety);
	}
};

})();

</script>
</head>
<body style="font-family: arial; font-size: 42px;">
<div style="background: #eeffee; margin-bottom: 10px;" id="container"></div>
</body>
</html>
