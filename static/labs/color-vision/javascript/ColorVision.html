<body style="background: #111">
<script type="text/javascript" src="./Color.Vision.Daltonize.js"></script>
<script type="text/javascript" src="./Color.Vision.Simulate.js"></script>
<script type="text/javascript" src="./QString.js"></script>
<script type="text/javascript">

function Simulate() {
	document.body.appendChild(image);
	// test simulation
	Color.Vision.Simulate(image, { 
		type: "Protanope",
		amount: 1.0,
		callback: function(canvas) { 
			document.body.appendChild(canvas);
		}
	});
	// test simulation
	Color.Vision.Simulate(image, { 
		type: "Deuteranope",
		amount: 1.0,
		callback: function(canvas) { 
			document.body.appendChild(canvas);
		}
	});
	// test simulation
	Color.Vision.Simulate(image, { 
		type: "Tritanope",
		amount: 1.0,
		callback: function(canvas) { 
			document.body.appendChild(canvas);
		}
	});
};

function Daltonize(type) {
	document.body.appendChild(image);
	// test daltonization
	Color.Vision.Simulate(image, { 
		type: type,
		amount: 1.0,
		callback: function(canvas) { 
			document.body.appendChild(canvas);
		}
	});
	Color.Vision.Daltonize(image, {
		type: type,
		amount: 1.0,
		callback: function(canvas) { 
			document.body.appendChild(canvas);
			// test daltonization with simulation
			Color.Vision.Simulate(canvas, {
				type: type,
				amount: 1.0,
				callback: function(canvas) {  
					document.body.appendChild(canvas);
				}
			});
		}
	});
};

var query = parse.qstring(window.location.search.substr(1)),
	image = new Image();

image.onload = function() {
	Daltonize(query.cvd || "Deuteranope");
};

image.src = query.image || "media/ishihara/18.jpg";

</script>
</body>
